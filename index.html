<!doctype html>
<!--
  en-GB rather than en: browsers render <input type="time"> and <input type="date">
  using the document language, so plain "en" inherits the OS regional format and shows
  a 12-hour AM/PM picker on a US-configured machine. en-GB pins the pickers to a
  24-hour clock and day/month/year dates, which is what the rest of the app already
  formats to. All display text stays English.
-->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#5B5BEF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hours" />
    <meta name="description" content="Track hours and pay across your jobs." />
    <title>Hour Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
