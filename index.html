<!doctype html>
<!--
  en-GB rather than en, for day/month date ordering in browsers that honour the
  document language (Safari, Firefox).

  It does NOT control <input type="time">. Chrome renders that from the *browser's*
  language setting, which no page attribute can override — verified directly: an input
  with an explicit lang="en-GB" still showed "02:30 PM" in a US-configured Chrome. That
  is why time entry uses the custom TimeField component instead of the native control.
-->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#5B5BEF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hours" />
    <meta name="description" content="Track hours and pay across your jobs." />
    <title>Hour Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
